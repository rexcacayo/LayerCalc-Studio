name: Manual Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0"

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/layercalc-release.jks"

      - name: Find Android build tools
        id: build_tools
        shell: bash
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "version=$BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Find release APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Zipalign APK
        run: |
          "$ANDROID_HOME/build-tools/${{ steps.build_tools.outputs.version }}/zipalign" \
            -v -p 4 \
            "${{ steps.apk.outputs.apk }}" \
            "$RUNNER_TEMP/layercalc-aligned.apk"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/${{ steps.build_tools.outputs.version }}/apksigner" sign \
            --ks "$RUNNER_TEMP/layercalc-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/LayerCalc-Studio-${{ inputs.version }}.apk" \
            "$RUNNER_TEMP/layercalc-aligned.apk"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/${{ steps.build_tools.outputs.version }}/apksigner" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/LayerCalc-Studio-${{ inputs.version }}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LayerCalc-Studio-${{ inputs.version }}-release
          path: ${{ runner.temp }}/LayerCalc-Studio-${{ inputs.version }}.apk
          retention-days: 14